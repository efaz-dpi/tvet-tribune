media:
  input: images
  output: /images

content:
  - name: portal
    label: TVET Tribune News & Ads Manager
    type: file
    path: data.json
    format: json
    fields:
      - name: featuredVideoId
        label: প্রধান ইউটিউব ভিডিও লিংক বা আইডি
        type: string
      - name: leadTitle
        label: প্রধান প্রতিবেদনের শিরোনাম
        type: string
      - name: featuredReporter
        label: প্রধান ভিডিওর প্রতিবেদকের নাম
        type: string
      - name: leadSummary
        label: প্রধান প্রতিবেদনের সারসংক্ষেপ
        type: text
      - name: socialLinks
        label: সোশ্যাল মিডিয়া লিংক (YouTube, Facebook, LinkedIn)
        type: object
        fields:
          - name: youtube
            label: YouTube চ্যানেল লিংক
            type: string
          - name: facebook
            label: Facebook পেজ লিংক
            type: string
          - name: linkedin
            label: LinkedIn পেজ লিংক
            type: string
      - name: exclusiveVideos
        label: এক্সক্লুসিভ ভিডিও গ্যালারি (সর্বশেষ ৩টি দেখাবে)
        type: object
        list: true
        fields:
          - name: title
            label: ভিডিওর শিরোনাম
            type: string
            required: true
          - name: videoUrl
            label: ইউটিউব ভিডিও লিংক বা আইডি
            type: string
            required: true
          - name: date
            label: তারিখ
            type: string
          - name: desk
            label: প্রতিবেদকের নাম
            type: string
      - name: ads
        label: বিজ্ঞাপন ম্যানেজমেন্ট (Ad Slots)
        type: object
        fields:
          - name: topBanner
            label: ১. উপরের ব্যানার বিজ্ঞাপন (728x90 px)
            type: object
            fields:
              - name: active
                label: বিজ্ঞাপন চালু করুন
                type: boolean
              - name: text
                label: বিকল্প বিজ্ঞাপনের লেখা
                type: string
              - name: image
                label: ব্যানার ছবি
                type: image
              - name: link
                label: বিজ্ঞাপনের লিংক
                type: string
          - name: sidebarBox
            label: ২. ডান পাশের বক্স বিজ্ঞাপন (300x250 px)
            type: object
            fields:
              - name: active
                label: বিজ্ঞাপন চালু করুন
                type: boolean
              - name: text
                label: বিকল্প বিজ্ঞাপনের লেখা
                type: string
              - name: image
                label: ব্যানার ছবি
                type: image
              - name: link
                label: বিজ্ঞাপনের লিংক
                type: string
          - name: midBanner
            label: ৩. মাঝখানের ব্যানার বিজ্ঞাপন (728x90 px)
            type: object
            fields:
              - name: active
                label: বিজ্ঞাপন চালু করুন
                type: boolean
              - name: text
                label: বিকল্প বিজ্ঞাপনের লেখা
                type: string
              - name: image
                label: ব্যানার ছবি
                type: image
              - name: link
                label: বিজ্ঞাপনের লিংক
                type: string
      - name: articles
        label: সকল সংবাদ (Articles)
        type: object
        list: true
        fields:
          - name: title
            label: খবরের শিরোনাম
            type: string
            required: true
          - name: cat
            label: বিভাগ নির্বাচন করুন (Category)
            type: select
            required: true
            options:
              values:
                - value: Notices
                  label: নোটিশ (Notices)
                - value: Training
                  label: প্রশিক্ষণ ও ডুয়েট (Training)
                - value: Job Placement
                  label: জব প্লেসমেন্ট (Job Placement)
                - value: Campus Politics
                  label: ক্যাম্পাস (Campus Politics)
                - value: Tech & Research
                  label: প্রযুক্তি ও গবেষণা (Tech & Research)
          - name: date
            label: প্রকাশের তারিখ (যেমন: ১৪ নভেম্বর ২০২৬)
            type: string
          - name: reporter
            label: প্রতিবেদকের নাম
            type: string
          - name: image
            label: ছবি যুক্ত করুন
            type: image
          - name: details
            label: মূল খবর
            type: text
            required: true
          - name: link
            label: মূল লিংক বা পিডিএফ যুক্ত করুন
            type: string
